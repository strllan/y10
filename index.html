<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compatibility Test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="progress-area" aria-label="Test progress">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-count" id="progress-count">0 / 10</p>
      </section>

      <div class="actions">
        <button class="button secondary" id="redo-button" type="button">Redo</button>
        <button class="button primary" id="next-button" type="button">Next</button>
      </div>

      <footer class="version-footer">v1.10</footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
