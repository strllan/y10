<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compatibility Test</title>
    <link rel="stylesheet" href="styles.css?v=1.20" />
  </head>
  <body>
    <main class="page">
      <section class="code-gate" id="code-gate" aria-labelledby="code-title">
        <div class="code-panel">
          <h1 id="code-title">Compatibility Test</h1>
          <form class="code-form" id="code-form" aria-label="Enter your 5 digit code" novalidate>
            <div class="code-entry" id="code-entry">
              <div class="code-slots" id="code-slots" aria-hidden="true">
                <span class="code-slot">_</span>
                <span class="code-slot">_</span>
                <span class="code-slot">_</span>
                <span class="code-slot">_</span>
                <span class="code-slot">_</span>
              </div>
              <input
                autocomplete="one-time-code"
                class="code-input"
                id="code-input"
                inputmode="numeric"
                maxlength="5"
                pattern="[0-9]{5}"
                type="text"
                aria-label="Enter your 5 digit code"
              />
            </div>
            <p class="code-error" id="code-error" role="alert"></p>
          </form>
        </div>
      </section>

      <div class="survey-view" id="survey-view" hidden>
        <section class="progress-area" aria-label="Test progress">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-cap" aria-hidden="true"></div>
          </div>
          <p class="progress-count" id="progress-count">0 / 10</p>
        </section>

        <div class="actions">
          <button class="button secondary" id="redo-button" type="button">Redo</button>
          <button class="button primary" id="next-button" type="button">Next</button>
        </div>
      </div>

      <footer class="version-footer">v1.20</footer>
    </main>

    <script src="script.js?v=1.20"></script>
  </body>
</html>
